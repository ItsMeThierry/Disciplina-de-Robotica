mission:
  frame_id: "odom"

  position_tolerance: 0.20      # 20 cm
  yaw_tolerance: 0.15           # ~8.6°
  waypoint_timeout: 30.0
  dwell_time: 1.0
  loop: false                 

  waypoints:

    - name: "vertice_B"
      position: {x: 2.0, y: 0.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 0.0}

    - name: "vertice_B_vira"
      position: {x: 2.0, y: 0.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.8660254, w: 0.5}

    - name: "vertice_C"
      position: {x: 1.0, y: 1.7320508, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.8660254, w: 0.5}
    
    - name: "vertice_C_vira"
      position: {x: 1.0, y: 1.7320508, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: -0.8660254, w: 0.5}

    - name: "vertice_fim"
      position: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: -0.8660254, w: 0.5}

    - name: "vertice_fim_vira"
      position: {x: 0.0, y: 0.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}